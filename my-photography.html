<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f2eb;
      --ink: #1a1814;
      --muted: #7a7060;
      --accent: #c94f1e;
      --line: #d9d4c8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 80px 40px 120px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: var(--ink);
    }

    nav { display: flex; gap: 28px; }

    nav a {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--accent); }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.1s forwards;
    }

    .sub {
      color: var(--muted);
      font-weight: 300;
      line-height: 1.8;
      max-width: 64ch;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.2s forwards;
      margin-bottom: 36px;
    }

    .gallery {
      border-top: 1px solid var(--line);
      padding-top: 36px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.3s forwards;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
    }

    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: var(--line);
      box-shadow: 0 4px 20px rgba(26, 24, 20, 0.08);
      transition: box-shadow 0.35s ease, transform 0.35s ease;
    }

    .gallery-item:hover {
      box-shadow: 0 12px 40px rgba(26, 24, 20, 0.12);
      transform: translateY(-4px);
    }

    .gallery-item:first-child {
      grid-column: 1 / -1;
      max-height: 75vh;
    }

    .gallery-item:first-child .gallery-item-inner {
      aspect-ratio: 21 / 9;
    }

    .gallery-item:not(:first-child) .gallery-item-inner {
      aspect-ratio: 4 / 3;
    }

    .gallery-item-inner {
      display: block;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .gallery-item-inner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.2) 0%, transparent 40%);
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .gallery-item:hover .gallery-item-inner::after {
      opacity: 1;
    }

    .gallery-item a {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      position: relative;
      z-index: 1;
      color: inherit;
      text-decoration: none;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
    }

    .gallery-item-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 24px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      z-index: 2;
      pointer-events: none;
    }

    .gallery-item:hover .gallery-item-caption {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery-loading {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 48px 0;
    }

    footer {
      border-top: 1px solid var(--line);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 72px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .gallery { gap: 20px; }
      .gallery-item:first-child .gallery-item-inner { aspect-ratio: 16 / 10; }
    }

    @media (max-width: 520px) {
      .page { padding: 48px 20px 80px; }
      header { flex-direction: column; gap: 16px; }
      footer { flex-direction: column; gap: 8px; }
      .gallery { grid-template-columns: 1fr; gap: 20px; padding-top: 24px; }
      .gallery-item:first-child .gallery-item-inner { aspect-ratio: 4 / 3; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="logo" href="./index.html">Ben Liu</a>
      <nav>
        <a href="./index.html#work">Work</a>
        <a href="./index.html#connect">Contact</a>
      </nav>
    </header>

    <main>
      <h1>My Photography</h1>
      <p class="sub">A selection of my photography. Placeholder images for now.</p>

      <div class="gallery" id="gallery-root">
        <div class="gallery-loading" id="gallery-loading">Loading…</div>
      </div>
    </main>

    <footer>
      <span>© <span id="yr"></span> Ben Liu</span>
      <span>Made with AI.</span>
    </footer>
  </div>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    (function () {
      function esc(s) {
        return String(s || '').replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      }
      var root = document.getElementById('gallery-root');
      var loading = document.getElementById('gallery-loading');
      fetch('./images/photos.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (!data || !data.photos || !data.photos.length) {
            if (loading) loading.textContent = 'No photos. Add entries to images/photos.json';
            return;
          }
          if (loading) loading.remove();
          var html = '';
          for (var i = 0; i < data.photos.length; i++) {
            var p = data.photos[i];
            html += '<div class="gallery-item">';
            html += '<a href="' + esc(p.url) + '" title="' + esc(p.title) + '" target="_blank" rel="noopener">';
            html += '<span class="gallery-item-inner"><img src="' + esc(p.src) + '" alt="' + esc(p.alt) + '" /></span>';
            html += '<span class="gallery-item-caption">' + esc(p.title) + '</span>';
            html += '</a></div>';
          }
          root.insertAdjacentHTML('beforeend', html);
        })
        .catch(function () {
          if (loading) loading.textContent = 'Could not load photos.';
        });
    })();
  </script>
</body>
</html>
