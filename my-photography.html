<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f2eb;
      --ink: #1a1814;
      --muted: #7a7060;
      --accent: #c94f1e;
      --line: #d9d4c8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 80px 32px 120px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: var(--ink);
    }

    nav { display: flex; gap: 28px; }

    nav a {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--accent); }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.1s forwards;
    }

    .sub {
      color: var(--muted);
      font-weight: 300;
      line-height: 1.8;
      max-width: 64ch;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.2s forwards;
      margin-bottom: 36px;
    }

    figure {
      border-top: 1px solid var(--line);
      padding-top: 28px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.3s forwards;
    }

    img.photo {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid rgba(217, 212, 200, 0.9);
    }

    figcaption {
      margin-top: 12px;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    footer {
      border-top: 1px solid var(--line);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 72px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .page { padding: 48px 20px 80px; }
      header { flex-direction: column; gap: 16px; }
      footer { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="logo" href="./index.html">Your Name</a>
      <nav>
        <a href="./index.html#work">Work</a>
        <a href="./index.html#connect">Contact</a>
      </nav>
    </header>

    <main>
      <h1>My Photography</h1>
      <p class="sub">One photo from 2025 on Mauna Kea.</p>

      <figure>
        <a data-flickr-embed="true" href="https://www.flickr.com/photos/204351264@N08/55117776306/in/dateposted-public/" title="2025 Mauna Kea">
          <img class="photo" src="https://live.staticflickr.com/65535/55117776306_2b036b8b32_b.jpg" width="1024" height="683" alt="2025 Mauna Kea" />
        </a>
        <figcaption>2025 — Mauna Kea (via Flickr)</figcaption>
      </figure>
      <script async src="//embedr.flickr.com/assets/client-code.js" charset="utf-8"></script>
    </main>

    <footer>
      <span>© <span id="yr"></span> Your Name</span>
      <span><a href="./index.html" style="color: inherit; text-decoration: none;">Back to home</a></span>
    </footer>
  </div>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
  </script>
</body>
</html>
