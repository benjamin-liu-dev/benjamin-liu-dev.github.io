name: Generate run stats

on:
  push:
    paths:
      - "runs/**/*.fit"
      - "scripts/generate_runs.py"
      - "requirements.txt"
      - ".github/workflows/generate-runs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate runs.json
        run: |
          python scripts/generate_runs.py

      - name: Commit updated JSON (if changed)
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add runs/runs.json
          git commit -m "chore: update run stats"
          git push
