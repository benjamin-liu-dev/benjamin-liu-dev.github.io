<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Hikes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #f5f2eb;
      --ink: #1a1814;
      --muted: #7a7060;
      --accent: #c94f1e;
      --line: #d9d4c8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 80px 32px 120px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: var(--ink);
    }

    nav { display: flex; gap: 28px; }

    nav a {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--accent); }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.1s forwards;
    }

    .sub {
      color: var(--muted);
      font-weight: 300;
      line-height: 1.8;
      max-width: 64ch;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.2s forwards;
      margin-bottom: 24px;
    }

    .map-section {
      border-top: 1px solid var(--line);
      padding-top: 28px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.3s forwards;
    }

    .map-wrap {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--bg);
    }

    #map {
      width: 100%;
      height: 480px;
      position: relative;
      z-index: 1;
    }

    .map-caption {
      margin-top: 12px;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .map-loading {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      border-top: 1px solid var(--line);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 72px;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .page { padding: 48px 20px 80px; }
      header { flex-direction: column; gap: 16px; }
      footer { flex-direction: column; gap: 8px; }
      #map { height: 360px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="logo" href="./index.html">Your Name</a>
      <nav>
        <a href="./index.html#work">Work</a>
        <a href="./index.html#connect">Contact</a>
      </nav>
    </header>

    <main>
      <h1>My Hikes</h1>
      <p class="sub">Trail traces from my hikes. Rifle Arch Trail — Colorado.</p>

      <section class="map-section">
        <div class="map-wrap">
          <div id="map">
            <div class="map-loading">Loading map and track…</div>
          </div>
        </div>
        <p class="map-caption">Rifle Arch Trail — GPX trace</p>
      </section>
    </main>

    <footer>
      <span>© <span id="yr"></span> Your Name</span>
      <span><a href="./index.html">Back to home</a></span>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    (function () {
      var mapEl = document.getElementById('map');
      var loadingEl = mapEl.querySelector('.map-loading');

      fetch('./gpx%20files/Rifle_Arch_Trail.gpx')
        .then(function (r) { return r.text(); })
        .then(function (gpxText) {
          var parser = new DOMParser();
          var doc = parser.parseFromString(gpxText, 'application/xml');
          var ns = 'http://www.topografix.com/GPX/1/1';
          var pts = doc.getElementsByTagNameNS(ns, 'trkpt');
          if (!pts.length) pts = doc.querySelectorAll('trkpt');
          if (!pts.length) {
            loadingEl.textContent = 'No track points found in GPX.';
            return;
          }
          var latlngs = [];
          for (var i = 0; i < pts.length; i++) {
            var lat = parseFloat(pts[i].getAttribute('lat'));
            var lon = parseFloat(pts[i].getAttribute('lon'));
            if (!isNaN(lat) && !isNaN(lon)) latlngs.push([lat, lon]);
          }
          if (!latlngs.length) {
            loadingEl.textContent = 'Could not parse track points.';
            return;
          }

          loadingEl.remove();
          var map = L.map('map').setView(latlngs[0], 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
          }).addTo(map);

          var polyline = L.polyline(latlngs, {
            color: '#c94f1e',
            weight: 4,
            opacity: 0.9
          }).addTo(map);
          map.fitBounds(polyline.getBounds(), { padding: [24, 24] });
        })
        .catch(function (err) {
          loadingEl.textContent = 'Could not load GPX: ' + (err.message || 'error');
        });

      document.getElementById('yr').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
