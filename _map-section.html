<section class="heatmap-section" id="combined-map-root">
  <p class="section-label">Hikes, runs & snow sports</p>
  <div class="map-filters">
    <label><input type="checkbox" data-map-filter="hikes" checked> <span class="filter-dot hikes-dot"></span> Hikes</label>
    <label><input type="checkbox" data-map-filter="runs" checked> <span class="filter-dot runs-dot"></span> Runs</label>
    <label><input type="checkbox" data-map-filter="snow" checked> <span class="filter-dot snow-dot"></span> Snow sports</label>
  </div>
  <div class="heatmap-wrap">
    <div id="combined-map">
      <div class="heatmap-loading">Loading routes…</div>
    </div>
  </div>
</section>
