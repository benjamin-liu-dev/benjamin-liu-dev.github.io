<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snow Sports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #f5f2eb;
      --ink: #1a1814;
      --muted: #7a7060;
      --accent: #c94f1e;
      --line: #d9d4c8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 80px 32px 120px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: var(--ink);
    }

    nav { display: flex; gap: 28px; }

    nav a {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--accent); }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.1s forwards;
    }

    .sub {
      color: var(--muted);
      font-weight: 300;
      line-height: 1.8;
      max-width: 64ch;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.2s forwards;
      margin-bottom: 28px;
    }

    .heatmap-section {
      border-top: 1px solid var(--line);
      padding-top: 28px;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.25s forwards;
    }

    .heatmap-section .section-label {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .map-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 20px 24px;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.78rem;
      color: var(--ink);
    }

    .map-filters label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 300;
    }

    .map-filters input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .filter-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .filter-dot.hikes-dot { background: #c94f1e; }
    .filter-dot.runs-dot { background: #1e5fc9; }
    .filter-dot.snow-dot { background: #0d9488; }

    .heatmap-wrap {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--line);
    }

    #heatmap,
    #combined-map {
      width: 100%;
      height: 380px;
      position: relative;
      z-index: 1;
    }

    .heatmap-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 380px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .snow-list {
      border-top: 1px solid var(--line);
      padding-top: 28px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.3s forwards;
    }

    .snow-loading {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 24px 0;
    }

    .snow-card {
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }

    .snow-card:last-child { border-bottom: none; }

    .snow-info { margin-bottom: 12px; }

    .snow-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      margin-bottom: 6px;
      color: var(--ink);
    }

    .snow-location {
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--muted);
    }

    .map-wrap {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--bg);
      width: 100%;
      aspect-ratio: 1;
      max-width: 400px;
    }

    .map-wrap .map {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    .map-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 120px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    footer {
      border-top: 1px solid var(--line);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 72px;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .page { padding: 48px 20px 80px; }
      header { flex-direction: column; gap: 16px; }
      footer { flex-direction: column; gap: 8px; }
      #combined-map { height: 280px; }
      .heatmap-loading { height: 280px; }
      .map-wrap { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="logo" href="./index.html">Ben Liu</a>
      <nav>
        <a href="./index.html#work">Work</a>
        <a href="./index.html#connect">Contact</a>
      </nav>
    </header>

    <main>
      <h1>Snow Sports</h1>
      <p class="sub">Skiing and snowboarding routes. Route maps only.</p>

      <div id="combined-map-container"></div>

      <section class="snow-list">
        <div id="snow-root" class="snow-loading">Loading…</div>
      </section>
    </main>

    <footer>
      <span>© <span id="yr"></span> Ben Liu</span>
      <span>Made with AI.</span>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./combined-map.js"></script>
  <script>
    (function () {
      document.getElementById('yr').textContent = new Date().getFullYear();

      function parseGpxToLatLngs(gpxText) {
        var parser = new DOMParser();
        var doc = parser.parseFromString(gpxText, 'application/xml');
        var ns = 'http://www.topografix.com/GPX/1/1';
        var pts = doc.getElementsByTagNameNS(ns, 'trkpt');
        if (!pts.length) pts = doc.querySelectorAll('trkpt');
        var latlngs = [];
        for (var i = 0; i < pts.length; i++) {
          var lat = parseFloat(pts[i].getAttribute('lat'));
          var lon = parseFloat(pts[i].getAttribute('lon'));
          if (!isNaN(lat) && !isNaN(lon)) latlngs.push([lat, lon]);
        }
        return latlngs;
      }

      function esc(s) {
        return String(s || '').replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      }

      var root = document.getElementById('snow-root');
      var SNOW_COLOR = '#0d9488';

      fetch('./snow-sports/snow-sports.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (!data || !data.activities || !data.activities.length) {
            root.textContent = 'No snow sports yet. Add .gpx files to snow-sports/ and run: python scripts/generate_snow_sports.py';
            root.classList.add('snow-loading');
            return;
          }
          var activities = data.activities;
          var html = '';
          for (var i = 0; i < activities.length; i++) {
            var a = activities[i];
            var locationStr = a.location || [a.city, a.state].filter(Boolean).join(', ');
            var loc = locationStr ? (' <span class="snow-location">' + esc(locationStr) + '</span>') : '';
            html += '<article class="snow-card">';
            html += '  <div class="snow-info">';
            html += '    <h2 class="snow-title">' + esc(a.title) + loc + '</h2>';
            html += '  </div>';
            html += '  <div class="map-wrap"><div id="map-' + i + '" class="map"><div class="map-loading">Loading…</div></div></div>';
            html += '</article>';
          }
          root.classList.remove('snow-loading');
          root.innerHTML = html;

          for (var j = 0; j < activities.length; j++) {
            (function (idx) {
              var gpxUrl = './' + encodeURIComponent(activities[idx].gpxPath).replace(/%2F/g, '/');
              fetch(gpxUrl)
                .then(function (r) { return r.text(); })
                .then(function (gpxText) {
                  var latlngs = parseGpxToLatLngs(gpxText);
                  var mapEl = document.getElementById('map-' + idx);
                  if (mapEl && latlngs.length) {
                    var loadingEl = mapEl.querySelector('.map-loading');
                    if (loadingEl) loadingEl.remove();
                    var map = L.map('map-' + idx, { zoomControl: false }).setView(latlngs[0], 14);
                    map.addControl(L.control.zoom({ position: 'bottomright' }));
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                    }).addTo(map);
                    L.polyline(latlngs, { color: SNOW_COLOR, weight: 3, opacity: 0.9 }).addTo(map);
                    map.fitBounds(L.latLngBounds(latlngs), { padding: [8, 8], maxZoom: 14 });
                  } else if (mapEl) {
                    var loadingEl = mapEl.querySelector('.map-loading');
                    if (loadingEl) loadingEl.textContent = 'Could not load GPX.';
                  }
                })
                .catch(function () {
                  var mapEl = document.getElementById('map-' + idx);
                  if (mapEl) {
                    var loadingEl = mapEl.querySelector('.map-loading');
                    if (loadingEl) loadingEl.textContent = 'Could not load GPX.';
                  }
                });
            })(j);
          }
        })
        .catch(function () {
          root.textContent = 'Could not load snow sports.';
          root.classList.add('snow-loading');
        });
    })();
  </script>
</body>
</html>
